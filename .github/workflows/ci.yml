name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs_version: [27.2, 28.2, 29.4, 30.1]
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Byte-compile (warnings are errors)
        run: |
          emacs -Q --batch \
            --eval '(progn (setq byte-compile-error-on-warn t) (byte-compile-file "classroom-call.el"))'

      - name: Run ERT tests
        run: |
          emacs -Q --batch -L . -l test/classroom-call-test.el \
            --eval '(ert-run-tests-batch-and-exit)'

      - name: Checkdoc
        run: |
          set -o pipefail
          emacs -Q --batch --eval '(checkdoc-file "classroom-call.el")' 2>&1 | tee /tmp/checkdoc.log
          if grep -q 'Warning' /tmp/checkdoc.log; then
            echo "::error::checkdoc warnings found"
            exit 1
          fi
